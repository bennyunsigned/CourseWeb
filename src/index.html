  <!-- Google Identity (CDN) -->
  <script src="https://accounts.google.com/gsi/client" async=""></script>
  <!-- Defensive initializer: find client_id from meta or from the Angular placeholder, and only initialize when available -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5910536965514788"
    crossorigin="anonymous"></script>
  <script>
    (function () {
      function getClientId() {
        try {
          var meta = document.querySelector('meta[name="google-signin-client_id"]');
          if (meta && meta.content) return meta.content;
          var onloadEl = document.getElementById('g_id_onload');
          if (onloadEl) {
            var attr = onloadEl.getAttribute('data-client_id') || onloadEl.getAttribute('data-client-id');
            if (attr) return attr;
          }
        } catch (e) { /* ignore */ }
        return null; // do not fallback to a hardcoded client id
      }

      function renderButtons() {
        try {
          var w = window;
          if (!w.google || !w.google.accounts || !w.google.accounts.id) return false;
          document.querySelectorAll('.g_id_signin').forEach(function (el) {
            try {
              if ((el.childElementCount || 0) === 0) {
                w.google.accounts.id.renderButton(el, { theme: 'outline', size: 'large' });
              }
            } catch (e) { /* ignore */ }
          });
          return true;
        } catch (e) { console.warn('GSI render error', e); return false; }
      }

      function initGSI() {
        try {
          var w = window;
          if (!w.google || !w.google.accounts || !w.google.accounts.id) return;
          if (!w.__gsi_initialized) {
            var clientId = getClientId();
            if (!clientId) return; // wait until Angular provides client id
            try { w.google.accounts.id.initialize({ client_id: clientId, callback: handleCredentialResponse }); } catch (e) { }
            w.__gsi_initialized = true;
          }
          renderButtons();
        } catch (e) { console.warn('GSI init error', e); }
      }

      // Run once DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initGSI);
      } else { initGSI(); }

      // Expose a global render function so SPA route navigations can trigger rendering
      try { if (!window.__gsi_render_buttons) window.__gsi_render_buttons = initGSI; } catch (e) { }
      // Observe DOM mutations: Angular may insert the placeholder later
      var mo = new MutationObserver(function () { initGSI(); });
      function startGsiObserver() {
        function begin() {
          try { mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-client_id', 'data-client-id'] }); } catch (e) {/* ignore */ }
        }
        if (document.body) { begin(); } else {
          document.addEventListener('DOMContentLoaded', begin);
        }
        // Keep observer running; it's cheap and ensures buttons render after route changes
      }
      startGsiObserver();
    })();
  </script>

<body id="page-top">
  <app-root></app-root>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5910536965514788"
    crossorigin="anonymous"></script>
  <script>
    function decodeJWT(token) {

      let base64Url = token.split(".")[1];
      let base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      let jsonPayload = decodeURIComponent(
        atob(base64)
          .split("")
          .map(function (c) {
            return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
          })
          .join("")
      );
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {

      console.log("Encoded JWT ID token: " + response.credential);

      const responsePayload = decodeJWT(response.credential);

      console.log("Decoded JWT ID token fields:");
      console.log("  Full Name: " + responsePayload.name);
      console.log("  Given Name: " + responsePayload.given_name);
      console.log("  Family Name: " + responsePayload.family_name);
      console.log("  Unique ID: " + responsePayload.sub);
      console.log("  Profile image URL: " + responsePayload.picture);
      console.log("  Email: " + responsePayload.email);
      // Dispatch a custom event so Angular can pick up the credential and profile
      try {
        window.dispatchEvent(new CustomEvent('google-id-token', { detail: { credential: response.credential, profile: responsePayload } }));
      } catch (e) {
        console.warn('Could not dispatch google-id-token event', e);
      }
    }
  </script>
