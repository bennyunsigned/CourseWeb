  <!-- Google Identity (kept as CDN) - special case: hosting this locally is possible but not recommended because Google updates this file. If you want it hosted locally, I can add it, but you'll need to accept the maintenance burden. -->
  <script src="https://accounts.google.com/gsi/client" async></script>
  <!-- Defensive initializer: ensure GSI button is rendered even if script/Angular timing varies -->
  <script>
    (function(){
      function initGSI(){
        try{
          var w = window;
          if(!w.google || !w.google.accounts || !w.google.accounts.id) return;
          var meta = document.querySelector('meta[name="google-signin-client_id"]');
          var clientId = (meta && meta.content) || '411656733323-2p348igl6kgfo7756i61ivng2b62fkov.apps.googleusercontent.com';
          if(!w.__gsi_initialized){
            try{ w.google.accounts.id.initialize({ client_id: clientId, callback: handleCredentialResponse }); }catch(e){}
            w.__gsi_initialized = true;
          }
          document.querySelectorAll('.g_id_signin').forEach(function(el){
            try{
              if((el.childElementCount||0) === 0){
                w.google.accounts.id.renderButton(el, { theme: 'outline', size: 'large' });
              }
            }catch(e){/* ignore */}
          });
        }catch(e){ console.warn('GSI init error', e); }
      }

      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', initGSI);
      } else { initGSI(); }

  // Expose a global render function so SPA route navigations can trigger rendering
  try { if(!window.__gsi_render_buttons) window.__gsi_render_buttons = initGSI; } catch(e){}
  // Observe DOM mutations for a short time: Angular may insert the placeholder later
  var mo = new MutationObserver(function(){ initGSI(); });
  function startGsiObserver(){
    if(document.body){
      try{ mo.observe(document.body, { childList: true, subtree: true }); }catch(e){/* ignore */}
      setTimeout(function(){ mo.disconnect(); }, 10000);
    } else {
      // If body isn't available yet, wait for DOMContentLoaded then start
      document.addEventListener('DOMContentLoaded', function(){
        try{ mo.observe(document.body, { childList: true, subtree: true }); }catch(e){/* ignore */}
        setTimeout(function(){ mo.disconnect(); }, 10000);
      });
    }
  }
  startGsiObserver();
    })();
  </script>

<body id="page-top">
  <app-root></app-root>
  <!-- Local Bootstrap bundle (includes Popper) -->
  <script src="/vendor/bootstrap.bundle.min.js"></script>
<script>
      function decodeJWT(token) {

        let base64Url = token.split(".")[1];
        let base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        let jsonPayload = decodeURIComponent(
          atob(base64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join("")
        );
        return JSON.parse(jsonPayload);
      }

      function handleCredentialResponse(response) {

        console.log("Encoded JWT ID token: " + response.credential);

        const responsePayload = decodeJWT(response.credential);

        console.log("Decoded JWT ID token fields:");
        console.log("  Full Name: " + responsePayload.name);
        console.log("  Given Name: " + responsePayload.given_name);
        console.log("  Family Name: " + responsePayload.family_name);
        console.log("  Unique ID: " + responsePayload.sub);
        console.log("  Profile image URL: " + responsePayload.picture);
        console.log("  Email: " + responsePayload.email);
        // Dispatch a custom event so Angular can pick up the credential and profile
        try {
          window.dispatchEvent(new CustomEvent('google-id-token', { detail: { credential: response.credential, profile: responsePayload } }));
        } catch (e) {
          console.warn('Could not dispatch google-id-token event', e);
        }
      }
    </script>
    <!-- Popup blur toggle: add/remove body.popup-open when Bootstrap popups appear -->
    <script>
      (function(){
        function updatePopupOpen(){
          var hasModal = !!document.querySelector('.modal.show');
          var hasPopover = !!document.querySelector('.popover.show');
          var hasTooltip = !!document.querySelector('.tooltip.show');
          var hasDropdown = !!document.querySelector('.dropdown-menu.show');
          if(hasModal || hasPopover || hasTooltip || hasDropdown){
            document.body.classList.add('popup-open');
          } else {
            document.body.classList.remove('popup-open');
          }
        }

        // Bootstrap events
        document.addEventListener('shown.bs.modal', updatePopupOpen);
        document.addEventListener('hidden.bs.modal', updatePopupOpen);
        document.addEventListener('shown.bs.popover', updatePopupOpen);
        document.addEventListener('hidden.bs.popover', updatePopupOpen);
        document.addEventListener('shown.bs.tooltip', updatePopupOpen);
        document.addEventListener('hidden.bs.tooltip', updatePopupOpen);
        document.addEventListener('shown.bs.dropdown', updatePopupOpen);
        document.addEventListener('hidden.bs.dropdown', updatePopupOpen);

        // MutationObserver fallback (guard against null document.body)
        var mo = new MutationObserver(updatePopupOpen);
        function startPopupObserver(){
          if(document.body){
            try{ mo.observe(document.body, { childList: true, subtree: true }); }catch(e){/* ignore */}
          } else {
            document.addEventListener('DOMContentLoaded', function(){
              try{ mo.observe(document.body, { childList: true, subtree: true }); }catch(e){/* ignore */}
            });
          }
        }
        startPopupObserver();

        // initial check
        if(document.readyState !== 'loading') updatePopupOpen(); else document.addEventListener('DOMContentLoaded', updatePopupOpen);
      })();
    </script>
