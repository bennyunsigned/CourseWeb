<section class="contact-us-section py-5" id="contact" style="background-color: #f0f8ff;"> <!-- Changed background color to AliceBlue -->
    <div class="container">
        <div class="row align-items-stretch">
            <!-- Left Side: Address Card + Contact Form -->
            <div class="col-lg-5 mb-4 d-flex flex-column">
                <div class="animate__animated animate__fadeInLeft d-flex flex-column flex-grow-1">
                    <div class="address-card p-4 mb-4 rounded shadow-sm bg-white">
                        <h5 class="mb-2 fw-bold">Our Office</h5>
                        <p class="mb-1">123, Block B, Lajpat Nagar-II</p>
                        <p class="mb-1">New Delhi - 110024</p>
                        <p class="mb-0">Delhi, India</p>
                        <div class="mt-3">
                            <a class="btn btn-directions d-inline-flex align-items-center" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=28.5672,77.2433">
                                <!-- SVG location pin -->
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="me-2">
                                    <path d="M12 2C8.13401 2 5 5.13401 5 9C5 13.25 9.6 18.18 11.17 19.86C11.6 20.34 12.4 20.34 12.83 19.86C14.4 18.18 19 13.25 19 9C19 5.13401 15.866 2 12 2Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <circle cx="12" cy="9" r="2.2" fill="currentColor"/>
                                </svg>
                                <span class="btn-text">Get Directions</span>
                            </a>
                        </div>
                    </div>

                    <h2 class="fw-bold display-6">Contact Us</h2>
                    <div class="form-container mt-3 d-flex flex-column flex-grow-1">
                        <form class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">                            
                                <input type="text" class="form-control form-control-lg" placeholder="Full name">
                            </div>
                            <div class="mb-3">                            
                                <input type="email" class="form-control form-control-lg" placeholder="Email">
                            </div>
                            <div class="mb-3">                            
                                <input type="tel" class="form-control form-control-lg" placeholder="Mobile number">
                            </div>
                            <div class="mb-3 flex-grow-1">                            
                                <textarea class="form-control form-control-lg h-100" rows="3" placeholder="Message"></textarea>
                            </div>
                            <div class="d-grid gap-2 mt-auto">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">Send Message</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Side: Google Maps -->
            <div class="col-lg-7 d-flex">
                <div class="animate__animated animate__fadeInRight d-flex flex-fill">
                    <div class="map-wrapper rounded flex-fill" style="overflow:hidden;">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d28157.123456789!2d77.2433!3d28.5672!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1694860000000"
                            width="100%"
                            height="100%"
                            style="border:0; min-height:420px;"
                            allowfullscreen=""
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
