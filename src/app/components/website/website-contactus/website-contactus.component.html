<section class="contact-us-section py-5 bg-panel" id="contact">
    <div class="container">
        <div class="row align-items-stretch">
            <!-- Left Side: Address Card + Contact Form -->
            <div class="col-lg-5 mb-4 d-flex flex-column">
                <div class="animate__animated animate__fadeInLeft d-flex flex-column flex-grow-1">
                    <div class="address-card p-4 mb-4 rounded shadow-sm bg-panel neon-border-sm">
                        <h5 class="mb-2 fw-bold">Our Office</h5>
                        <p class="mb-1">Level-6 Express Trade Towers</p>
                        <p class="mb-1">Noida Expressway</p>
                        <p class="mb-1">Uttar Pradesh, India</p>
                        <div class="mt-3">
                            <a class="btn btn-directions d-inline-flex align-items-center" target="_blank"
                                rel="noopener"
                                href="https://www.google.com/maps/dir/?api=1&destination=28.514580,77.377594">
                                <!-- SVG location pin -->
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg" class="me-2">
                                    <path
                                        d="M12 2C8.13401 2 5 5.13401 5 9C5 13.25 9.6 18.18 11.17 19.86C11.6 20.34 12.4 20.34 12.83 19.86C14.4 18.18 19 13.25 19 9C19 5.13401 15.866 2 12 2Z"
                                        stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                    <circle cx="12" cy="9" r="2.2" fill="currentColor" />
                                </svg>
                                <span class="btn-text">Get Directions</span>
                            </a>
                        </div>
                    </div>

                    <h2 class="fw-bold display-6">Contact Us</h2>
                    <div class="form-container mt-3 d-flex flex-column flex-grow-1">
                        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <input type="text" formControlName="name" class="form-control form-control-lg"
                                    placeholder="Full name"
                                    [class.is-invalid]="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
                                    Please enter your full name (min 2 characters)
                                </div>
                            </div>
                            <div class="mb-3">
                                <input type="email" formControlName="email" class="form-control form-control-lg"
                                    placeholder="Email"
                                    [class.is-invalid]="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
                                    Please enter a valid email address
                                </div>
                            </div>
                            <div class="mb-3">
                                <input type="tel" formControlName="mobile" class="form-control form-control-lg"
                                    placeholder="Mobile number"
                                    [class.is-invalid]="contactForm.get('mobile')?.invalid && contactForm.get('mobile')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="contactForm.get('mobile')?.invalid && contactForm.get('mobile')?.touched">
                                    Please enter a valid 10-digit mobile number
                                </div>
                            </div>
                            <div class="mb-3 flex-grow-1">
                                <textarea formControlName="message" class="form-control form-control-lg h-100" rows="3"
                                    placeholder="Message"
                                    [class.is-invalid]="contactForm.get('message')?.invalid && contactForm.get('message')?.touched"></textarea>
                                <div class="invalid-feedback"
                                    *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">
                                    Please enter your message (min 10 characters)
                                </div>
                            </div>
                            <div class="d-grid gap-2 mt-auto">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold"
                                    [disabled]="isSubmitting">
                                    <span *ngIf="!isSubmitting">Send Message</span>
                                    <span *ngIf="isSubmitting">Sending...</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Side: Google Maps -->
            <div class="col-lg-7 d-flex">
                <div class="animate__animated animate__fadeInRight d-flex flex-fill">
                    <div class="map-wrapper rounded flex-fill bg-panel neon-border" style="overflow:hidden;">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3503.8234567890123!2d77.377594!3d28.514580!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjjCsDMwJzUyLjUiTiA3N8KwMjInMzkuMyJF!5e0!3m2!1sen!2sin!4v1694860000000"
                            width="100%" height="100%" style="border:0; min-height:320px;" allowfullscreen=""
                            loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
