<main class="auth-responsive bg-panel">
    <section class="hero">
        <div class="hero-bg" style="background-image: url('/img/photos/unsplash-1.jpg')"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="fw-bold">Welcome Back!</h1>
            <p class="lead">Resume your learning journey. Access courses, modules, and community discussions with a single sign in.</p>
        </div>
    </section>

    <section class="form-wrap">
        <div class="form-card">
            <div class="card floating-card shadow-lg border-0">
                <div class="card-body">
                    <div class="m-sm-2">
                        <form [formGroup]="form" (ngSubmit)="onSubmit()">
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" placeholder="Enter your email" id="email" formControlName="email"
                                        class="form-control form-control-lg neon-input">
                                    <div class="error-feedback" *ngIf="hasDisplayableError('email')">
                                        <ng-container [ngSwitch]="form.controls['email'].errors | firstkey">
                                            <div *ngSwitchCase="'required'">Please enter your email.</div>
                                            <div *ngSwitchCase="'email'">Please enter a valid email.</div>
                                        </ng-container>
                                    </div>
                                </div>

                                <div class="col-12 mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" placeholder="Enter your password" id="password" formControlName="password"
                                        class="form-control form-control-lg neon-input">
                                    <div class="error-feedback" *ngIf="hasDisplayableError('password')">
                                        <ng-container [ngSwitch]="form.controls['password'].errors | firstkey">
                                            <div *ngSwitchCase="'required'">Please enter your password.</div>
                                        </ng-container>
                                    </div>
                                </div>

                                <div class="col-12 mb-3 d-flex align-items-center">
                                    <div class="form-check">
                                        <input id="rememberMe" type="checkbox" class="form-check-input" value="remember-me" name="remember-me" checked>
                                        <label class="form-check-label text-small" for="rememberMe">Remember me</label>
                                    </div>
                                    <div class="ms-auto">
                                        <a routerLink="/forgot-password" class="text-muted">Forgot password?</a>
                                    </div>
                                </div>

                                <div class="col-12 d-grid gap-2 mt-2">
                                    <button type="submit" class="btn btn-lg neon-btn fw-bold">Sign In</button>
                                </div>
                            </div>
                        </form>

                        <div class="g-signin-wrap d-grid gap-2 mt-4">
                            <div id="g_id_onload" data-auto_prompt="false" data-callback="handleCredentialResponse"
                                [attr.data-client_id]="googleAuthKey">
                            </div>
                            <div class="g_id_signin"></div>
                        </div>

                        <div class="text-center mt-4">
                            <p class="text-muted">
                                Don't have an account?
                                <a routerLink="/signup" class="fw-bold text-primary">Sign Up</a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
