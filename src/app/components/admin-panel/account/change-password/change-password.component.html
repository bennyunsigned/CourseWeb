<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <fieldset class="border rounded-3 p-3 mb-2" style="border-color: #0d6efd;">
    <legend class="float-none w-auto px-3 mb-0 fw-bold text-primary" style="font-size: 1rem;">
      Change Password
    </legend>
    <div class="alert alert-info mb-3" *ngIf="isGoogleUser">
      Google sign-in users cannot change password.
    </div>

    <!-- Current Password -->
    <div class="mb-3">
      <label for="currentPassword" class="form-label">Current Password</label>
      <div class="input-group has-toggle">
        <input id="currentPassword" [type]="showCurrent ? 'text' : 'password'" class="form-control" formControlName="currentPassword" autocomplete="current-password">
        <button type="button" class="btn btn-outline-secondary toggle" (click)="showCurrent = !showCurrent" [attr.aria-label]="showCurrent ? 'Hide password' : 'Show password'">
          <i class="bi" [ngClass]="showCurrent ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
      <div class="invalid-feedback d-block" *ngIf="f['currentPassword'].touched && f['currentPassword'].errors">
        <span *ngIf="f['currentPassword'].errors['required']">Current password is required.</span>
        <span *ngIf="f['currentPassword'].errors['minlength']">Must be at least 6 characters.</span>
      </div>
    </div>

    <!-- New Password -->
    <div class="mb-3">
      <label for="newPassword" class="form-label">New Password</label>
      <div class="input-group has-toggle">
        <input id="newPassword" [type]="showNew ? 'text' : 'password'" class="form-control" formControlName="newPassword" autocomplete="new-password">
        <button type="button" class="btn btn-outline-secondary toggle" (click)="showNew = !showNew" [attr.aria-label]="showNew ? 'Hide password' : 'Show password'">
          <i class="bi" [ngClass]="showNew ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
      <div class="strength mt-2" *ngIf="form.get('newPassword')?.value">
        <div class="bars">
          <span class="bar" [class.active]="newPasswordStrength.score >= 1"></span>
          <span class="bar" [class.active]="newPasswordStrength.score >= 2"></span>
          <span class="bar" [class.active]="newPasswordStrength.score >= 3"></span>
        </div>
        <small class="ms-2" [ngClass]="{
          'text-danger': newPasswordStrength.label==='Weak',
          'text-warning': newPasswordStrength.label==='Medium',
          'text-success': newPasswordStrength.label==='Strong'
        }">{{ newPasswordStrength.label }}</small>
      </div>
      <div class="invalid-feedback d-block" *ngIf="f['newPassword'].touched && f['newPassword'].errors">
        <span *ngIf="f['newPassword'].errors['required']">New password is required.</span>
        <span *ngIf="f['newPassword'].errors['minlength']">Must be at least 8 characters.</span>
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm New Password</label>
      <div class="input-group has-toggle">
        <input id="confirmPassword" [type]="showConfirm ? 'text' : 'password'" class="form-control" formControlName="confirmPassword" autocomplete="new-password">
        <button type="button" class="btn btn-outline-secondary toggle" (click)="showConfirm = !showConfirm" [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'">
          <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
      <div class="invalid-feedback d-block" *ngIf="f['confirmPassword'].touched && (f['confirmPassword'].errors || form.errors?.['passwordsMismatch'])">
        <span *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your new password.</span>
        <span *ngIf="form.errors?.['passwordsMismatch']">Passwords do not match.</span>
      </div>
    </div>

    <button class="btn btn-primary w-100" type="submit" [disabled]="submitting || isGoogleUser">
      <span *ngIf="!submitting">Update Password</span>
      <span *ngIf="submitting">Updating...</span>
    </button>
  </fieldset>
</form>
