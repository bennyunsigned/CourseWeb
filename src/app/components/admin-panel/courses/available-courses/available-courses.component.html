<div class="category-tabs-container mb-4">
  <div class="d-flex flex-row flex-wrap">
    <button
      *ngFor="let cat of categories"
      class="category-tab-btn me-2 mb-2"
      [class.active]="cat.CategoryId === selectedCategoryId"
      (click)="onCategoryTabClick(cat.CategoryId)">
      {{ cat.CategoryName }}
    </button>
  </div>
</div>

<!-- Search Bar -->
<div class="mb-3" style="max-width: 400px;">
  <div class="input-group shadow-sm" style="border-radius: 1.5rem; background: #f8fafc;">
    <span class="input-group-text bg-white border-0 px-2" style="font-size:1.2rem;color:#888; background: transparent;">
      <i class="bi bi-search"></i>
    </span>
    <input
      type="text"
      class="form-control border-0 bg-transparent"
      placeholder="Search courses..."
      [(ngModel)]="searchText"
      (ngModelChange)="onSearchTextChange()"
      style="border-radius: 1.5rem; background: transparent; font-size: 1rem; box-shadow: none;"
    />
  </div>
</div>

<div class="row mb-4">
  <div *ngFor="let course of displayedCourses" class="col-md-4 col-sm-12 mb-4">
    <div class="card course-card h-100 shadow-sm position-relative" (click)="onCardClick(course.CourseId)">
      <div class="course-banner" [style.backgroundImage]="'url(' + course.BannerImage + ')'">
        <div class="badge-row">
          <span *ngIf="course.IsBestSeller" class="badge badge-best-seller">Best Seller</span>
          <span *ngIf="course.IsPremium" class="badge badge-premium">Premium</span>
          <span class="badge badge-duration">
            {{ course.TotalDurationPerCourse | durationFormat }}
          </span>
        </div>
      </div>
      <div class="card-body d-flex flex-column">
        <h5 class="card-title text-truncate mb-2" title="{{ course.CourseName }}">{{ course.CourseName }}</h5>
        <ul class="list-group list-group-flush mb-2">
          <li class="list-group-item py-1 px-0 border-0">
            <strong>Price:</strong>
            <span *ngIf="course.DiscountedPrice < course.ActualPrice">
              <del class="text-danger">{{ course.ActualPrice | currency:'INR' }}</del>
              <span class="text-success ms-2">{{ course.DiscountedPrice | currency:'INR' }}</span>
            </span>
            <span *ngIf="course.DiscountedPrice >= course.ActualPrice">
              {{ course.ActualPrice | currency:'INR' }}
            </span>
          </li>
        </ul>
        <div class="mt-auto d-flex gap-2 justify-content-between">
          <button class="btn btn-success btn-xs flex-fill" (click)="buyNow(course.CourseId); $event.stopPropagation();">
            <i class="bi bi-bag-check"></i> Buy Now
          </button>
          <button class="btn btn-cart btn-xs flex-fill" (click)="addToCart(course.CourseId); $event.stopPropagation();">
            <i class="bi bi-bell"></i> Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Pagination Controls (Course Progress Style) -->
<div *ngIf="visiblePages.length > 1" class="bottom-pagination mt-3">
  <nav aria-label="Courses pagination">
    <ul class="pagination pagination-modern justify-content-center">
      <!-- First Page -->
      <li class="page-item" [class.disabled]="categoryPagination[selectedCategoryId].currentPage === 0">
        <button class="page-link" (click)="goToPage(0)" [disabled]="categoryPagination[selectedCategoryId].currentPage === 0" title="First page">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </li>
      <!-- Previous Page -->
      <li class="page-item" [class.disabled]="categoryPagination[selectedCategoryId].currentPage === 0">
        <button class="page-link" (click)="previousPage()" [disabled]="categoryPagination[selectedCategoryId].currentPage === 0" title="Previous page">
          <i class="bi bi-chevron-left"></i>
        </button>
      </li>
      <!-- Page Numbers -->
      <ng-container *ngFor="let p of visiblePages">
        <li class="page-item" [class.active]="p === categoryPagination[selectedCategoryId].currentPage">
          <button class="page-link" (click)="goToPage(p)" [title]="'Go to page ' + (p + 1)">
            {{ p + 1 }}
          </button>
        </li>
      </ng-container>
      <!-- Next Page -->
      <li class="page-item" [class.disabled]="categoryPagination[selectedCategoryId].currentPage === (categoryPagination[selectedCategoryId].totalPages - 1)">
        <button class="page-link" (click)="nextPage()" [disabled]="categoryPagination[selectedCategoryId].currentPage === (categoryPagination[selectedCategoryId].totalPages - 1)" title="Next page">
          <i class="bi bi-chevron-right"></i>
        </button>
      </li>
      <!-- Last Page -->
      <li class="page-item" [class.disabled]="categoryPagination[selectedCategoryId].currentPage === (categoryPagination[selectedCategoryId].totalPages - 1)">
        <button class="page-link" (click)="goToPage(categoryPagination[selectedCategoryId].totalPages - 1)" [disabled]="categoryPagination[selectedCategoryId].currentPage === (categoryPagination[selectedCategoryId].totalPages - 1)" title="Last page">
          <i class="bi bi-chevron-double-right"></i>
        </button>
      </li>
    </ul>
  </nav>
</div>
