<div class="aw-course-subscription p-3">
  <div class="container-fluid">
    <h3 class="mb-3">Course Subscriptions</h3>
    <div class="row g-3">
      <div class="col-md-4" *ngFor="let s of subscriptions">
        <div class="card h-100 shadow-sm subscription-admin-card">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="mb-1">{{ s.SubscriptionName }}</h5>
                <p class="text-muted small mb-0">{{ s.SubscriptionDescription }}</p>
              </div>
              <div class="text-end">
                <div class="price">{{ formatPrice(s.SubscriptionPrice) }}</div>
              </div>
            </div>
            <div class="mt-3">
              <ul class="mb-3 features">
                <li>Access to premium courses</li>
                <li>Community support</li>
                <li>New content updates</li>
              </ul>
              <button class="btn btn-success w-100" (click)="buySubscription(s)">Activate Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
