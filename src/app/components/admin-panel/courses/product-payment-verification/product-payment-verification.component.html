<div class="verification-container d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card shadow-lg border-0 text-center p-5" style="max-width: 500px; border-radius: 20px;">

        <!-- Pending State -->
        <div *ngIf="status === 'pending'">
            <div class="spinner-border text-primary mb-4" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h4>Verifying Payment...</h4>
            <p class="text-muted">Please wait while we confirm your payment status.</p>
        </div>

        <!-- Success State -->
        <div *ngIf="status === 'success'">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            </div>
            <h2 class="fw-bold mb-3">Payment Successful!</h2>
            <p class="text-muted mb-4">{{ message }}</p>
            <button class="btn btn-success px-5 py-2 fw-bold" (click)="backToProducts()">
                Back to Products
            </button>
        </div>

        <!-- Failed/Error State -->
        <div *ngIf="status === 'failed' || status === 'error'">
            <div class="mb-4">
                <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem;"></i>
            </div>
            <h2 class="fw-bold mb-3">Payment Failed</h2>
            <p class="text-muted mb-4">{{ message }}</p>
            <button class="btn btn-danger px-5 py-2 fw-bold" (click)="backToProducts()">
                Try Again
            </button>
        </div>

    </div>
</div>
