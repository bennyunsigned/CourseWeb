<div class="payment-success-container container mt-5">
  <div class="card p-4 text-center">
    <h3 *ngIf="status==='pending'">Checking payment status...</h3>
    <h3 *ngIf="status==='success'" class="text-success">Payment Successful</h3>
    <h3 *ngIf="status==='failed'" class="text-danger">Payment Failed</h3>
    <h3 *ngIf="status==='error'" class="text-warning">Error</h3>

    <p class="mt-3">{{ message }}</p>

    <div *ngIf="status==='pending'" class="spinner my-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <button class="btn btn-primary mt-3" (click)="backToCourses()">Back to Courses</button>
  </div>
</div>
