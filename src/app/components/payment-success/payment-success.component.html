<div class="status-container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card glass-panel border-0 text-center p-5 shadow-lg mx-3" style="max-width: 500px;">

    <div *ngIf="status === 'pending'">
      <div class="spinner-border text-primary mb-4" style="width: 3rem; height: 3rem;" role="status"></div>
      <h3 class="fw-bold">Checking Payment Status...</h3>
      <p class="text-muted">Please wait while we verify your transaction.</p>
    </div>

    <div *ngIf="status === 'success'">
      <div class="mb-4">
        <img src="img/payments/payment_success.png" alt="Success" class="status-img mb-4">
        <h1 class="display-5 fw-bold text-success">Success!</h1>
      </div>
      <p class="text-muted mb-4 fs-5">{{ message }}</p>
      <button (click)="backToCourses()" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm">
        Back to Courses <i class="bi bi-arrow-right ms-2"></i>
      </button>
    </div>

    <div *ngIf="status === 'failed' || status === 'error'">
      <div class="mb-4">
        <img src="img/payments/payment_failure.png" alt="Failed" class="status-img mb-4">
        <h1 class="display-5 fw-bold text-danger">Failed</h1>
      </div>
      <p class="text-muted mb-4 fs-5">{{ message }}</p>
      <button (click)="backToCourses()" class="btn btn-outline-light w-100 py-3 fw-bold rounded-pill">
        Go Back
      </button>
    </div>

  </div>
</div>
