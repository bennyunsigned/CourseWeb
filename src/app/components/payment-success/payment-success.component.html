<div class="payment-status-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <!-- Dynamic background elements for premium feel -->
  <div class="bg-gradient-circle success-bg" *ngIf="status === 'success'"></div>
  <div class="bg-gradient-circle failure-bg" *ngIf="status === 'failed' || status === 'error'"></div>

  <div class="content-box text-center p-4 p-md-5">

    <!-- Loading State -->
    <div *ngIf="status === 'pending'" class="reveal-animation">
      <div class="loader-wrapper mb-4">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
      <h2 class="fw-bold tracking-tight text-white">Verifying Transaction</h2>
      <p class="text-white-50">Please stay on this page while we secure your payment.</p>
    </div>

    <!-- Success State -->
    <div *ngIf="status === 'success'" class="reveal-animation">
      <div class="status-icon-wrapper success mb-4">
        <div class="icon-circle">
          <i class="bi bi-check2-circle"></i>
        </div>
      </div>
      <h1 class="display-4 fw-black text-white mb-2">Payment Received!</h1>
      <p class="text-white-50 fs-5 mb-5 px-md-5">{{ message }}</p>

      <div class="action-buttons gap-3 d-flex flex-column flex-md-row justify-content-center">
        <button (click)="backToHome()" class="btn btn-primary-premium btn-lg rounded-pill px-5 py-3">
          <i class="bi bi-house-door me-2"></i> Back to Home
        </button>
      </div>
    </div>

    <!-- Failure / Error State -->
    <div *ngIf="status === 'failed' || status === 'error'" class="reveal-animation">
      <div class="status-icon-wrapper failure mb-4">
        <div class="icon-circle">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
      </div>
      <h1 class="display-4 fw-black text-white mb-2">Oops!</h1>
      <p class="text-white-50 fs-5 mb-5 px-md-5">{{ message }}</p>

      <div class="action-buttons gap-3 d-flex flex-column flex-md-row justify-content-center">
        <button (click)="backToCourses()" class="btn btn-danger-premium btn-lg rounded-pill px-5 py-3">
          <i class="bi bi-arrow-left me-2"></i> Try Again
        </button>
        <button (click)="backToHome()" class="btn btn-outline-premium btn-lg rounded-pill px-5 py-3">
          <i class="bi bi-house-door me-2"></i> Back to Home
        </button>
      </div>
    </div>

  </div>
</div>
